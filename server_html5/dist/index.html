<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="icon" href="index.icon.png">
<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
<title>Tiên Môn Linh Vận</title>
<style>
:root { color-scheme: dark; }
html, body { height: 100%; }

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #0e2a3d;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #c7ebff;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		

/* Bỏ màn hình tải: không thanh tiến trình, nền là cảnh tiên môn */
#status { background: #c7ebff url("bg.jpg") center / cover no-repeat !important; }
#status-progress { display: none !important; }

#load-pct { position:absolute; left:0; right:0; bottom:calc(8% + env(safe-area-inset-bottom, 0px)); text-align:center;
  font: 600 15px/1.2 system-ui, sans-serif; color:#285b7a; text-shadow:0 1px 2px rgba(255,255,255,.9); letter-spacing:.04em; }
</style>
</head>
<body>

		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
			<div id="load-pct">Đang tải tiên môn…</div>
		</div>

		<script>
/* Giới hạn độ nét vẽ trên điện thoại (màn hình DPR 2-3) ở 1.5 để giảm tải vẽ, phản hồi nhanh hơn. */
(function(){var r=window.devicePixelRatio||1;if(r>1.5){try{Object.defineProperty(window,'devicePixelRatio',{get:function(){return 1.5;},configurable:true});}catch(e){}}})();
</script>
<script>
/* Sao lưu bằng mã 7 ký tự: chạy bằng start_server.py thì lưu trên máy chủ (api/backup); host tĩnh thì lưu trong trình duyệt. */
window.tmlvBackup = (function () {
  var ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  function gen() { var s; do { s = ''; for (var i = 0; i < 7; i++) s += ABC[Math.floor(Math.random() * ABC.length)]; } while (!/[A-Z]/.test(s) || !/[0-9]/.test(s)); return s; }
  function key(c) { return 'tmlv_backup_' + c; }
  function localSave(text) { var c; for (var k = 0; k < 20; k++) { c = gen(); if (localStorage.getItem(key(c)) === null) break; } localStorage.setItem(key(c), text); return c; }
  async function save(text) {
    try { var r = await fetch('api/backup', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: text });
      if (r.ok) return (await r.json()).code; } catch (e) {}
    return localSave(text);
  }
  async function load(code) {
    code = String(code || '').trim().toUpperCase();
    if (!/^[A-Z0-9]{7}$/.test(code)) throw new Error('Mã sao lưu gồm đúng 7 ký tự chữ và số.');
    try { var r = await fetch('api/backup/' + code); if (r.ok) return await r.text(); } catch (e) {}
    var t = localStorage.getItem(key(code));
    if (t === null) throw new Error('Không tìm thấy mã ' + code + '.');
    return t;
  }
  return {
    saveCb: function (text, ok, fail) { save(String(text)).then(ok, function (e) { fail((e && e.message) || 'Không tạo được mã sao lưu.'); }); },
    loadCb: function (code, ok, fail) { load(code).then(ok, function (e) { fail((e && e.message) || 'Không khôi phục được.'); }); }
  };
})();
</script>
<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":15624116,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pctEl = document.getElementById('load-pct');
					if (pctEl) pctEl.textContent = 'Đang tải tiên môn… ' + Math.min(100, Math.floor(current * 100 / total)) + '%';
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	
</body>
</html>
